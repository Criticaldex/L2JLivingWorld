# ---------------------------------------------------------------------------
# Fake players
# ---------------------------------------------------------------------------
# Our fake player system uses the existing NPC system, allowing fake players
# to function seamlessly like NPCs with minimal impact on server performance.

# Enable fake players.
EnableFakePlayers = True

# Enable chatting with fake players.
FakePlayerChat = True

# Enable autonomous movement/behavior (wander, patrol) for fake players.
# Requires data/FakePlayerBehavior.xml. Route-driven fake players (Routes.xml) are left untouched.
FakePlayerBehavior = True

# Fallback procedural spawn count, ONLY used when data/FakePlayerBehavior.xml defines no
# <population> groups. With populations defined (the default), this value is ignored and the
# populations control where and how many bots spawn. Requires FakePlayerBehavior.
FakePlayerDeployCount = 0

# Base NPC template id used for all procedurally generated bots. Their name, race, gender,
# class, hair and colors are overridden per-instance, so one template is enough.
# 0 = auto-pick the first available fake player template.
FakePlayerBaseNpcId = 0

# Enable shots usage for fake players.
FakePlayerUseShots = True

# Reward PvP kills by killing fake players.
FakePlayerKillsRewardPvP = True

# Fake player kills apply karma rules.
FakePlayerUnflaggedKillsKarma = True

# Fake players can be attacked without PvP flagging.
FakePlayerAutoAttackable = False

# Aggressive AI fake players attack nearby monsters.
FakePlayerAggroMonsters = True

# Fake players do not initiate attacks on nearby players. They still retaliate
# through the normal NPC hate/combat system when a player attacks them.
FakePlayerAggroPlayers = False

# Aggressive AI fake players attack nearby fake players.
FakePlayerAggroFPC = False

# Fake players can drop items when killing monsters.
FakePlayerCanDropItems = True

# Fake players can pickup dropped items.
FakePlayerCanPickup = True

# Credit YOU (the human) for quest kills your partied AI land, so you don't have to
# steal the last hit on every mob. When a recruited party member or personal support
# buddy lands the killing blow, the quest "onKill" is attributed to the phantom's
# owner (the player who recruited it) instead of the phantom. Any per-killer quest
# condition (faction allegiance, level, etc.) is then checked against you, not the AI.
# Only the owner is credited - a second human in the party still earns from their own
# last hits and their own recruits, exactly as in stock L2.
FakePlayerPartyQuestCredit = True

# How close (in game units) you must be to the kill for that credit to apply, so AI
# can't farm quests for you while you idle in town. 0 disables the distance check.
FakePlayerPartyQuestCreditRange = 1500

# Let AI party members (recruited phantoms / support buddies) take their share of party
# XP/SP. By default they are excluded from the split, so YOU keep 100% of the party's
# experience even though the AI is fighting alongside you. Set True for a more "realistic"
# party feel where the AI counts toward the level-based XP split (you keep less, but it
# behaves like a real grouped party). Default: False (you keep all the XP).
FakePlayerPartyExpShare = True

# Let AI party members roll for party loot and take an adena share, like real members.
# By default they are excluded from loot rolls and adena distribution, so drops and adena
# stay with you (recruited phantoms already don't pick items up; this also stops them
# quietly eating an adena cut they can never spend). Set True to have them roll like a
# normal party member. Default: False (you keep everything).
FakePlayerPartyLootShare = False

# Recruited combat-party gear quality. When a recruited party spawns, each member has a
# chance to arrive with a modest uniform enchant on its weapon and armor. These control
# that: the percent chance a member is enchanted at all, and the inclusive +min..+max
# range rolled when it is. Raise for better-geared recruits, lower/zero for plainer ones.
# Defaults: 65% chance, +3 to +6.
FakePlayerRecruitEnchantChance = 65
FakePlayerRecruitEnchantMin = 0
FakePlayerRecruitEnchantMax = 4

# Additively load auto-generated field-hunter zones from data/PhantomPopulations.generated.xml
# (produced by tools/build_populations.py) alongside your hand-authored data/PhantomPopulations.xml.
# The generated file is parsed AFTER the authored one, so your hand-authored buddies, regulars, and
# crafted friends are always kept - the generated set only ADDS plain field-hunter zones derived from
# the server's own spawn data. Each generated zone stays dormant until a real player approaches, so a
# world-wide set costs nothing at idle. When False only PhantomPopulations.xml is loaded.
# Workflow: run tools/build_populations.py to (re)generate the side file, review it in tools/fpc-editor,
# then keep this True. If True but the side file is missing, the server logs a hint and loads the
# authored set only. Default: True.
PhantomAutoHuntingZones = True

# Give auto-hunt field hunters the same data-driven skill rotations that recruited party members use
# (data/PhantomPlaystyles.xml), instead of leaving all skill casting to the native round-robin AutoUse.
# When True, a field FIGHTER whose class has a generic playstyle hands its offensive casting to the
# playstyle engine (auto-attack, shots and potions stay on AutoUse), so it uses its listed skills at the
# paced, condition-gated moments the engine decides. A class with no generic playstyle, and mage hunters,
# keep today's pure-AutoUse behavior. Recruited parties and buddies are never affected. This is a live
# off-switch: set False to fall straight back to the previous field-hunter behavior without a rebuild.
# Default: True.
PhantomHunterPlaystyles = True

# Let auto-hunt field hunters retaliate: if a monster starts attacking a hunter while it is ignoring that
# monster (typically an add that jumps the hunter as it runs to a target it has not engaged yet), the
# hunter turns to deal with the attacker. It does NOT flip targets once it is already trading blows with a
# mob - a second monster also hitting it is left alone until the current one is dealt with, so two attackers
# never ping-pong the hunter back and forth. Switching is further damped: it only takes an attacker no other
# phantom already owns, never abandons a target that is almost dead, and waits out a short per-phantom
# cooldown. All switches go through the same claim/deconflict rules as normal hunting, so multi-phantom mob
# spread and deference to real players are preserved. Set False to keep hunters on their first target.
# Default: True.
PhantomHunterRetaliate = True
